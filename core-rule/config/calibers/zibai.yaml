api_version: 1
# 紫白日/时盘的九宫飞布方向口径。
#
# 背景：入中星确定后，九星如何铺到八宫有两说 —— 顺飞（洛书路径星数递增）
# 与逆飞（移入中宫后逆布八方）。年、月两盘通书共识为顺飞；争议集中在日、时两盘：
# 《选择求真》日家三元紫白作「移入中宫，逆飞八方」，通行通书多作顺飞。
# 两说对同一入中星会给出相反的宫位分布，从而改变「五黄到山」等结论。
caliber_set: zibai_fly
description: 紫白日/时盘九宫飞布方向（顺飞 / 逆飞）
default: shun
calibers:
  shun:
    status: 待考证
    description: 顺飞（洛书路径星数递增：中→乾→兑→艮→离→坎→坤→震→巽）
    note: 通行通书口径；年、月两盘恒用顺飞，口径只作用于日、时两盘。本系统默认。
  ni:
    status: 有争议
    description: 逆飞（《选择求真》日家三元紫白「逆飞八方」）
    note: 与顺飞在日、时盘的宫位分布上互为镜像；对同一入中星，「五黄到山」结论可能相反。
    requires:
      - 《选择求真》日家紫白原文（版本 + 卷次）
