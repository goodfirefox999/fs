api_version: 1
# 天德「卦位」取支口径。
#
# 背景：天德口诀「正丁二坤宫，三壬四辛同，五乾六甲上，七癸八艮中，九丙十居乙，
# 子巽丑庚从」——十二个月里有四个月落在四维卦（卯坤、午乾、酉艮、子巽），
# 而卦要落到地支才能与日支比对。两说：
#   《渊海子平》系：坤＝申、乾＝亥、艮＝寅、巽＝巳；
#   《考原》系：    坤＝未、乾＝戌、艮＝丑、巽＝辰。
# 两说在卦宫层面一致（未申同居坤宫、戌亥同居乾宫、丑寅同居艮宫、辰巳同居巽宫），
# 分歧只在「取单支还是取整宫」，故默认口径取整宫并集（最贴近「坤宫」字面）。
caliber_set: tiande_guaxiang
description: 天德四维卦位的取支方式（整宫并集 / 渊海单支 / 考原单支）
default: gong_union
calibers:
  gong_union:
    status: 待考证
    description: 整宫并集——坤=未申、乾=戌亥、艮=丑寅、巽=辰巳（日支落宫即值天德）
    note: 默认。两说的并集，最贴近原文「坤宫」的字面读法；换单支口径会缩小命中面。
  shen_hai_yin_si:
    status: 有争议
    description: 渊海子平系——坤=申、乾=亥、艮=寅、巽=巳
    note: 与考原系在四个月的命中日上互斥（如卯月：本口径只认申日，考原只认未日）。
    requires:
      - 《渊海子平》论天德原文（版本 + 卷次）
  wei_xu_chou_chen:
    status: 有争议
    description: 考原系——坤=未、乾=戌、艮=丑、巽=辰
    note: 六壬家多从此说（《考原》曰「乾是戌，艮是丑，巽是辰，坤是未」）。
    requires:
      - 《星历考原》论天德原文（版本 + 卷次）
