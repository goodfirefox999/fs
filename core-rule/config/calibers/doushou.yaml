api_version: 1
# 斗首「得位」判定中，土行寄生十二宫的长生位口径。
#
# 背景：斗首以化气五行于月令逢长生/冠带/临官/帝旺为「得位」。
# 木长生在亥、火在寅、金在巳、水在申四者无争议；
# **土的长生位有两说**——土寄坤（长生在申）与土寄艮（长生在寅）。
# 两说只影响「土」这一个五行在十二个月支上的旺衰位次，
# 从而影响 斗首 DS-DEWEI 类规则的判定，故必须显式选口径、报告回显。
caliber_set: doushou_tu_changsheng
description: 斗首得位——土行长生位（土寄坤 / 土寄艮）
default: shen
calibers:
  shen:
    status: 待考证
    description: 土寄坤，土长生在申（与水同宫）
    note: 通书多从此说；本系统默认。
  yin:
    status: 待考证
    description: 土寄艮，土长生在寅（与火同宫）
    note: 部分斗首抄本从此说；与默认口径在「土」行的得位判定上结论不同。
