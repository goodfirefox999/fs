# A 级影印「实物档案」——把可追溯性从代码层落到叶面层
#
# 为什么单独建这份档案：规则 YAML 里的 citation 只回答「引了哪本书、哪一卷」，
# 回答不了「哪一叶、哪张图、谁逐字看过」。电子文本（识典／维基文库／ctext）
# 互相转抄时会一起错，只有影印叶面 + 图片哈希能证明「我们确实看过这一页」。
#
# 纪律（不可协商）：
#   1. 只有人眼逐字读过叶面才可登记 quote_verbatim；没读过的不写，进 gaps。
#   2. agent 只能填 agent_checked_by，**绝不能填 verified_by**。
#   3. verified_by 为 null 时，该条不得被规则 loader 当作「已考证」依据；
#      人工复核签名后才可把 status 改为 human_countersigned。
#   4. 图片哈希按 page_url 原样下载计算；换 scale／换镜像都必须重算并改记录。
#
# 本档案不新增门禁，只做「可追溯层」的数据源；校验见
# tests/unit/test_citation_archive.py（schema 与「agent 不得签名」）。

schema_version: 1
updated_at: "2026-11-04"

edition:
  book: 欽定協紀辨方書
  edition: 欽定四庫全書·子部七·術數類（浙江大學圖書館藏本影印，Internet Archive universallibrary）
  archive_collection: https://archive.org/details/06056501.cn
  image_variant: jpeg@scale=4
  note: >-
    叶次 leaf 一律指 archive.org 扫描件内的 0 基页序（page/n{leaf}.jpg），
    不是原书刻本的「叶几」。刻本叶次需另据卷首目录换算，尚未完成。

policy:
  human_signature_field: verified_by
  agent_must_not_sign: true
  status_values:
    - pending_human_countersign
    - human_countersigned
  levels:
    agent_visual_read: AI 逐字读影印叶面并抄录；未经人类复核，不得作为签名依据。
    human_countersigned: 人类复核过叶面与逐字引文，verified_by 非空。

