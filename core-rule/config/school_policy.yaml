  安葬: [public]
  破土: [public]
  立碑: [public]
  修坟: [public]
  修祠: [public]
  安龛: [public]
  升座: [public]
  开光: [public]
  嫁娶: [public]
  纳采: [public]
  出行: [public]
  签约: [public]
  开业: [public]
  交易: [public]
  求医: [public]
  祭祀: [public]

default_route: [public]
