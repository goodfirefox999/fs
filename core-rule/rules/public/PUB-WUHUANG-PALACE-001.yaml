# 影子规则（shadow）：只出观察值，不进任何强度桶。裁定前不得升为投票。
#
# 为什么单独成条而不是改 PUB-WUHUANG-001：
#   五黄到宫是"一宫三山"（兑=庚酉辛），而 PUB-WUHUANG-001 用的是
#   facts.wuhuang.year.hit_mountain（只认宫心那一山，2024 年仅酉命中）。
#   把原规则改成 hit_palace = 扩大命中面 = 改变行为分布，属 QUESTION Q-018 待裁项。
#   正确路径（AGENTS.md 硬禁止第 8/9 条）：先以 engine_eligible=false 观察一版，
#   比对人审通过后再决定升 vote 还是 hard_gate。
