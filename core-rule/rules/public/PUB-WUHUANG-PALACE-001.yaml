notes: |
  影子规则。与 PUB-WUHUANG-001 的唯一差别是命中粒度：
  原规则 hit_mountain（宫心一山）保守，本规则 hit_palace（整宫三山）完整。
  两者差值 = 八干山（庚辛壬癸甲乙丙丁）是否计入五黄，这是 Q-018 的核心争议，
  不可由 Agent 裁定。观察方式：报告「参考层命中」节会出现本规则，
  vectors 与 tier 不受影响（engine_eligible=false）。
  升格条件：连续一个版本周期的命中率统计 + 人类师傅比对无异议。
