notes: 待考证：月德合取月德干之五合（丙辛/甲己/丁壬/乙庚），力度弱于月德本干。2026-11-03 已对浙江大学图书馆藏四库本影印卷五叶二十九逐字核对；定字分歧已记录：维基文库四库本作「二六十月在巳」，影印本作「己」，本规则从影印作「己」。判据三条：① 影印字形与同书天德合条「六月己」（卷五叶二十五）同形（开口形），而与同叶「戊在巳為金母」的闭口「巳」不同；② 月德合为月德之五合，甲→己；③ 同叶考原「則己辛丁乙」。维基文库该页标注「請根據四庫全書掃描版校對本頁」，属未校对文本，故不以文库本改字。尚缺人类签名，故 status 仍为待考证。
