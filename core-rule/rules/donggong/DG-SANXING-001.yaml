  donggong_sanxing_60jiazi.json 按 60 甲子固定展开（煞贡/直星/人专三循环），
  不随月建变化；而董公/金符经三星起例以月建分组（四季月组等），同一日干支在
  不同月建下值星不同——例：甲午日在四季月应为卜木，不是人专。故本表在修正前
  对**全年所有日期**的三星判定均不可信，不只是未月甲午。修正需按「月建+日干支」
  重建查表键（或 12 张月建分组表）并逐条对原本；修正前即使命中也不得引用。
