notes: 2026-11-03 已对浙江大学图书馆藏四库本影印卷六叶五十三（Internet Archive 06056507.cn 第 n53 叶）逐字核对，原文见 citation.quote；尚缺人类签名，故 status 仍为待考证。本条曾以 facts.structure.liuhe_pairs 为条件，但 structure_facts 从不产出该键，规则恒降级「输入不足」；原引「卷二·本原」亦有误，六合实在卷六义例四。今按原文改为月建六合日，并显式声明偏离：原 explanation 所述「日与坐山/主命六合」不是本条所据原文，如师傅要保留该口径，应另立新规则。适用范围依卷十一用事宜忌收窄为安葬（「宜天徳月徳天徳合月徳合天赦天願六合鳴吠」）与嫁娶（「宜天徳月徳天徳合月徳合天赦天願三合天喜六合不將」）；卷十·六合「宜宴㑹結婚姻嫁娶進人口經絡醞釀立劵交易納財納畜安葬」，修倉庫仅限「与月恩四相时德併」，故不再泛化到修造。
