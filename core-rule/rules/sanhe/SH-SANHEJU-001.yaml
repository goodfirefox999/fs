explanation: 日课地支三合局与坐山/入首龙构成三合（申子辰水/亥卯未木/寅午戌火/巳酉丑金）。facts.structure.sanhe_groups
  已由 core-symbol 产出。
supersedes: null
notes: >-
  spec：同局=旺，缺一=待，不成局=平。三合局成员判定需要日课四柱+坐山+入首龙 的三合局归属分析。
  facts.structure.sanhe_groups 已产出三合组但"同局/缺一"的 分级判定需要更深的引擎逻辑。
  2026-11-03 评审登记（Q-025）：本条出处与实现语义不符，不能补 quote 了事。卷六·义例四
  三合条（浙图藏四库本影印 06056507.cn 叶五 / #page/n9）原文是「月建三合日」——
  「歷例曰正月在午戌二月在未亥…」；本条代码判的是「日课三合局 vs 坐山/入首龙」，
  原引「卷二·本原」亦非三合条目。处置三选一：A 改语义为月建三合日 / B 拆成
  「月建三合日」+「坐山三合局」两条（后者需另找出处）/ C 降参考或弃用；
  详见 docs/QUESTIONS.md Q-025。裁定前保持待考证：命中不投票、不作为证据；
  docs/signoff-2026-11-03.md 列为「不可签」。另：影印历例「十二月在丑巳」与三合局
  推演（丑月三合为巳酉）不符，走 A/B 时不得照抄，须按考原「各與其月建會成三合局」
  推演并记录版本差异。
