explanation: >-
  四柱天干化气为「我克」者三见，斗首称「三武格」（武财三见），主财禄。
  本课命中三武格（参考层，不参与否决）。
supersedes: null
notes: >-
  三武格的计数口径与三元格同源（是否计月干），未裁定前只报参考命中。
  另：武财为「我克」之神，古籍有「财多身弱」之戒——三元/三武并见时以元辰为主，
  该取舍属流派分歧，本系统不做加权，两格分别登记。
