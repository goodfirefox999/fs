explanation: >-
  克我者为破军（破鬼），斗首以为大凶。本课四柱天干化气克山者重见，
  按斗首视角为退气之课（参考层，不参与否决）。
supersedes: null
notes: >-
  「重见」取二重为触发线：一重破军是否即论凶各本不一（有本以「见破即凶」，
  有本以「破军得制可用」），故本规则取较保守的二重，且 severity 只到「慎用」，
  不设 hard_veto——斗首在 school_policy 中 participates_in_veto=false。
