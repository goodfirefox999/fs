explanation: >-
  坐山斗首五行于月令逢长生／冠带／临官／帝旺，斗首称「山家得位」，主旺相。
  本课山家得位（参考层，不参与否决）。
supersedes: null
notes: >-
  得位的**土行口径**未裁定：土寄坤（长生在申）与土寄艮（长生在寅）两说，
  由 caliber ``doushou_tu_changsheng`` 控制，默认 shen，报告强制回显。
  山家五行非土时两说结论相同；为土时两说可给出相反结论，此时规则输出仍为
  「参考命中」，报告须并列两口径结论。
