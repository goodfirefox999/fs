explanation: >-
  四柱天干化气与坐山斗首五行同者三见，斗首称「三元格」，为造葬课格之首。
  本课命中三元格（参考层，不参与否决）。
supersedes: null
notes: >-
  三元格的**计数口径**有分歧：一以四柱天干见三为三元（本系统采用），
  一以「年日时三干」为限（月干不计）。后者未裁定前，本规则只报「参考命中」，
  不据此提升 tier；报告须回显计数明细（facts.doushou.counts）。
