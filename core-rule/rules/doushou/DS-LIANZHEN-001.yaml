explanation: >-
  我生者为廉贞（廉子），斗首以为泄气。本课四柱天干化气泄山者重见，
  按斗首视角为山家泄弱之课（参考层，不参与否决）。
supersedes: null
notes: >-
  廉贞的吉凶分歧大于破军：多数抄本以「我生为泄、为凶」，亦有以「廉子主子孙繁衍」
  作吉论者。本规则取慎用（不取禁用），并在报告理由里显式标注该分歧。
