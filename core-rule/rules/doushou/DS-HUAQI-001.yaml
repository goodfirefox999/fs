explanation: >-
  坐山斗首五行为「我」，日课天干化气五行与山同者为一重元辰。
  本课四柱天干见元辰，斗首以元辰为吉星（本派参考层，不参与否决）。
supersedes: 1
notes: >-
  v1 曾以「天干五合」近似斗首化气（facts.structure.gan_he_pairs），是错误建模：
  五合是干与干之间的关系，斗首化气是「天干 → 五行」的固定映射
  （甲己土／乙庚金／丙辛水／丁壬木／戊癸火），与是否成合无关。
  v2 改为查 facts.doushou.counts.元辰（真斗首化气）。
  吉凶强度：元辰为吉属通说；但「一重元辰即论吉」的力度各本不一，故 severity 取「可用」而非「推荐」。
