name: ci

on:
  push:
    branches: [main, master, "ci/**"]
  pull_request:
  # 验证分支（ci/verify-py314 这类）必须能自动触发：只挂 main/master 会让
  # 「推临时分支跑 Action 验 Python 补丁版」静默不跑，等于没验。
  workflow_dispatch:

# Actions 运行时（2026-11-03）：Node 20 已弃用并会硬失败。下列是各自最小的
# Node 24 版本：checkout@v5、setup-python@v6、upload-artifact@v6。
# 注意 upload-artifact@v5 默认仍跑 Node 20（见其 v6 release notes），
# 升到 v6 才真正消除警告。宿主 runner 均 ≥2.327.1，满足 node24 最低要求。
jobs:
  test:
    # 显式钉 OS 版本：ubuntu-latest 已滚到 26.04，而 actions/python-versions 的
    # 3.14.2 linux x64 构建不覆盖 26.04（实测 setup-python 直接失败）。
    # 钉 24.04 才能拿到与本地一致的 3.14.2；换 OS 等于换编译器，需重测地板。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 需要 git diff 做 status 签名检查

      - uses: actions/setup-python@v6
        with:
          # 与本地开发 venv 完全一致到补丁版（3.14.2）：只写 3.14 会漂到不同
          # 小版本，coverage 的分支计数仍可能差 0.1–0.3pp，零余量地板会假红。
          python-version: "3.14.2"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest pytest-cov coverage==7.17.0 hypothesis ruff lunar_python pyswisseph

      - name: Export PYTHONPATH
        run: |
          echo "PYTHONPATH=core-time/src:core-symbol/src:core-rule/src:core-eval/src:app-zeri/src:." >> $GITHUB_ENV

      - name: Validate workflow YAML
        run: python tools/check_yaml.py

      - name: Lint (ruff)
        run: ruff check core-time core-symbol core-rule core-eval app-zeri tests tools || true
        # 首次接入先不阻断；规则收敛后去掉 `|| true`

      - name: Rules lint (DSL / 引用完整性 / 派别声明)
        run: python -m app_zeri.cli rules lint

      - name: Tests with coverage (total ≥ 80% + package/file ratchet + perf smoke)
        # 走 make cov，保证 CI 与本地同一路径：新鲜采集、ratchet、无插桩性能冒烟、
        # junit 汇总四项不会各自漂移。PYTHON=python 用 setup-python 的解释器。
        run: make cov PYTHON=python

      - name: Performance smoke budget record
        # 3.0s 档在 CI 实测 2.62s，余量 0.38s；把每次实测记进 summary，让「快不够了」
        # 提前可见，而不是等它红。（--perf 已在 make cov 里打过 perf_smoke_seconds 行）
        if: always()
        run: |
          python tools/perf_smoke_record.py --junit out/junit-perf-smoke.xml --warn-above 2.5

      - name: Upload perf smoke result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: perf-smoke
          path: |
            out/junit-perf-smoke.xml
            out/perf-smoke.jsonl
          if-no-files-found: ignore

      - name: Performance budget (4380 candidates, local 3.5s / CI 13.0s)
        # 落 junit：失败用例名/耗时/断言消息要能被下一步汇总，不能只活在 job log。
        run: python -m pytest -m slow --junitxml=out/junit-bench.xml

      - name: Upload performance history (CI samples)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bench-history-ci
          path: tests/bench/bench_history.ci.jsonl
          if-no-files-found: ignore

      - name: Test summary (all suites; failures must be visible)
        # run #33 的教训：summary 只报 perf_smoke=1.33s（通过），slow bench 超档
        # 却只在 log 里，读 summary 的人不知道红在哪。这里汇总所有 junit 套件。
        if: always()
        # tee：Step Summary 是写进文件的外部状态，同时回显到 job log 才能事后核对。
        # --scope ci：严格对称差（缺失/未登记都报 ❌）；本地须显式 --scope local
        # （只核对 make cov 可产出的套件，bench 只能由 CI 证明）。
        run: python tools/ci_summary.py --dir out --scope ci | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Determinism gate (decision blocks, output warns)
        run: python tools/determinism_gate.py --out-dir out

      - name: Surface OUTPUT_FAIL (warn, do not hide)
        if: always()
        run: |
          if [ -f out/output-fail.flag ]; then
            echo "::warning title=OUTPUT_FAIL::报告文本跨进程不稳定；本次为带警告通过，详见 out/output-fail.flag"
            {
              echo "## ⚠️ OUTPUT_FAIL（带警告通过）"
              echo ""
              echo '```json'
              cat out/output-fail.flag
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ 无 OUTPUT_FAIL flag"
          fi

      - name: Upload OUTPUT_FAIL flag
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: output-fail-flag
          path: out/output-fail.flag
          if-no-files-found: ignore

      - name: Status signature check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python tools/check_status_signature.py --base "origin/${{ github.base_ref }}" --head HEAD
          else
            python tools/check_status_signature.py --base HEAD~1 --head HEAD
          fi

      - name: No-network scan (runtime code must not import network modules)
        run: python tools/no_network_scan.py

      - name: "Cache-key lint (C19: all composite cache keys via stable_cache_key)"
        run: python tools/cache_key_lint.py

      - name: Engine version bump reminder (warn only)
        run: python tools/check_engine_version.py "HEAD~1"

      - name: Commit split hint (warn only, AGENTS.md 纪律 5)
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | cut -d/ -f1 | sort -u | tr '\n' ' ')
          echo "本次提交改动顶层目录：$CHANGED"
          if echo "$CHANGED" | grep -q "tools" && echo "$CHANGED" | grep -qE "docs|core"; then
            echo "⚠️ 混合提交提示：同时改动 tools/ 与 docs|core/——确认是否应拆分（AGENTS.md 纪律 5，惯例非阻断）"
          fi

      - name: Golden regression must pass
        run: python -m pytest tests/golden -v

      - name: Mutation spot-check (verify tests actually catch errors)
        run: python tools/mutation_check.py

  golden-report:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"
      - run: |
          pip install pyyaml
          echo "PYTHONPATH=core-time/src:core-symbol/src:core-rule/src:core-eval/src:app-zeri/src:." >> $GITHUB_ENV
      - name: Render golden case report
        run: |
          # 独立 job 是全新 workspace，out/ 不会从 test job 继承（二者不共享文件系统）。
          mkdir -p out
          python -m app_zeri.cli verify \
            --course 2027-07-11T14:00 --azimuth 320 \
            --task 修造 --strictness strict --allow-unverified \
            --out out/golden-report.md
      - uses: actions/upload-artifact@v6
        with:
          name: golden-report
          path: out/golden-report.md
