[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fengshui-collector"
version = "0.1.0"
description = "龙行天下风水论坛灵珠子精华帖结构化采集系统（个人研究用）"
requires-python = ">=3.11"

dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "rich>=13.7",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
# 测试与静态检查。安装：pip install -r requirements.lock（含全部精确版本）
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "types-PyYAML",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lxml.*"
ignore_missing_imports = true
